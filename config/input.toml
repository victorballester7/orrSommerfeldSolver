[params]
n = 175 # Number of polynomial for spectral approximation
re = 1980.1856413820287 # Reynolds number
beta = { r = 0.0, i = 0.0 } # spanwise wavenumber

[singleRunParams]
var = { r = 0.1122, i = 0.0 }       # alpha (for temporal branch) or omega (for spatial branch)
useTargetEV = false # If true, select the eigenvalue/eigenvector closest to targetEV instead of using the instability heuristic.
targetEV = { r = 0.3, i = 0.0 } # Target eigenvalue used only when useTargetEV = true (for spatial branch this is alpha).

# fill only when run_multiple = true
[multipleRunParams]
vars_r = {min = 0.01, max = 0.4, num = 20} # Range of alpha_r values to run (for temporal branch) or omega_r values (for spatial branch)
vars_i = {min = 0.0, max = 0.0, num = 1} # Range of alpha_i values to run (for temporal branch) or omega_i values (for spatial branch)

[flags]
branch = "temporal" # Options are: "temporal" (fixed alpha, solves the eigenvalue problem for omega), "spatial" (fixed omega, solves the eigenvalue problem for alpha)
problem = "Custom" # Options are: "BoundaryLayer, "Poiseuille", "Couette", "Custom"
doPlot = false # If true, the code will plot the eigenvalues
use_c = false # When temporal branch is used, plot in terms of c instead of omega (omega = alpha * c), if alpha is not 0.
multipleRun = true # If true, the code will run multiple cases with different alpha and omega, check the [runMultipleFlags] section

# fill only when problem = "Custom"
[customProblemFlags]
# filenameUprofile = "/home/victor/Desktop/PhD/src/flatPlateRe1000inc/directLinearSolver/blowingSuction/wgnInsideDomainDivFree/data/points_n600_x866.5.dat" # File with the U profile (x and U) to be used in the custom problem
filenameUprofile = "/home/victor/Desktop/PhD/src/flatPlateRe1000inc/directLinearSolver/blowingSuction/wgnInsideDomainDivFree/data//points_n600_x986.5.dat" #filenameUprofile = "/home/victor/Desktop/PhD/src/flatPlateRe1000inc/directLinearSolver/blowingSuction/wgnInsideDomainDivFree/data/points_n600_x206.5.dat"
#filenameUprofile = "/home/victor/Desktop/PhD/src/incGapRe1000/directLinearSolver/blowingSuctionCoarserMesh/d1.25_w90/data/points_n600_x883.5.dat"
plotUprofile = false # If true, the code will plot the U profile input.
blasiusLikeDomain = true # If true, the code will use a rational mapping from [0, oo) to [-1, 1] for the y coordinate. If false, it will linearly map the y coordinate from [0, ymax] to [-1, 1].
colX = 1               # Column of the x (actually y) coordinate in the file 
colY = 2               # Column of the y (actually U) coordinate in the file
numSkipHeaderLines = 3 # Number of lines to skip at the beginning of the file

[plot]
plotLims = { xmin = -0.25, xmax = 7.5, ymin = -1.5, ymax = 2.7 } # Limits of the plot
